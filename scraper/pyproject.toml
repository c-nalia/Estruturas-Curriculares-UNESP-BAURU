[project]
name = "curriculos-unesp-bauru"
version = "2.0.0"
description = "Baixa as estruturas curriculares vigentes da FEB, FC e FAAC (UNESP Bauru)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
curriculos-unesp = "curriculos_unesp.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["curriculos_unesp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
